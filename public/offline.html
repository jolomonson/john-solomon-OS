<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · 24 @ 24</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #171717; }
      @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #ededed; } }
      main { padding: 16px; text-align: center; max-width: 320px; }
      p { opacity: .7; font-size: 14px; }
      button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>24 @ 24 needs a connection to load your data. Your last changes are safe on the server.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
